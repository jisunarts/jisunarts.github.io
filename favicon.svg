<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="박지선 Park Jisun">
  <title>박지선 Park Jisun</title>
  <!-- 로고와 같은 형태 — 형광 연두 점 하나에 파란 테두리.
       화면의 .logo-dot 은 지름 16px · 테두리 1px 입니다.
       탭 아이콘은 16px 로 줄어들어 그 비율(1/16)이면 테두리가 반 픽셀로 뭉개지므로
       stroke-width 를 3 으로 조금 굵혔습니다 (16px 에서 1.5px).
       연두는 흰 배경과 대비가 1.18 밖에 안 되어 거의 안 보입니다.
       모양을 붙잡아 주는 것은 파란 테두리라, 이 선이 favicon 의 본체입니다. -->
  <circle cx="16" cy="16" r="14.5" fill="#CCFF00" stroke="#1668E0" stroke-width="3"/>
</svg>
